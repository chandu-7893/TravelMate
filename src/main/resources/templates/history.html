<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>💐💐Booking History | TravelMate</title>
    <link rel="stylesheet" href="/css/history.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<h1 class="history-title">My Booking History</h1>

<div th:if="${#lists.isEmpty(bookings)}" class="empty-box">
    <h2>No Bookings Found</h2>
    <p>Your booked trips will appear here.</p>
</div>

<div class="history-grid" th:if="${!#lists.isEmpty(bookings)}">

    <div class="history-card" th:each="booking : ${bookings}">

        <h2 class="place-name" th:text="${booking.place}">Goa</h2>

        <div class="detail">
            <span><i class="fa-solid fa-hotel"></i> Hotel</span>
            <b th:text="${booking.hotel}">Premium</b>
        </div>

        <div class="detail">
            <span><i class="fa-solid fa-car"></i> Vehicle</span>
            <b th:text="${booking.vehicle}">Flight</b>
        </div>

        <div class="detail">
            <span><i class="fa-solid fa-calendar-days"></i> Days</span>
            <b th:text="${booking.days}">3</b>
        </div>

        <div class="detail">
            <span><i class="fa-solid fa-users"></i> Members</span>
            <b th:text="${booking.members}">2</b>
        </div>

        <div class="detail">
            <span><i class="fa-solid fa-indian-rupee-sign"></i> Amount</span>
            <b th:text="'₹' + ${booking.finalAmount}">₹6000</b>
        </div>

        <div class="detail">
            <span><i class="fa-solid fa-receipt"></i> Transaction</span>
            <b th:text="${booking.transactionId}">TXN123</b>
        </div>

        <span class="status"
              th:text="${booking.paymentStatus}"
              th:classappend="${booking.paymentStatus == 'PAID'} ? ' paid' : ' pending'">
            PAID
        </span>

        <div class="card-buttons">

            <a th:if="${booking.paymentStatus == 'PAID'}"
               th:href="@{'/ticket/download/' + ${booking.id}}"
               class="download-btn">
                <i class="fa-solid fa-download"></i> Ticket
            </a>

            <a th:if="${booking.paymentStatus == 'PENDING'}"
               th:href="@{'/payment/' + ${booking.id}}"
               class="pending-btn">
                <i class="fa-solid fa-credit-card"></i> Complete Payment
            </a>

            <a href="/dashboard" class="view-btn">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>

            <form th:action="@{'/delete/' + ${booking.id}}"
                  method="post"
                  class="delete-form">

                <button type="button"
                        class="delete-btn"
                        onclick="openDeleteModal(this)">
                    <i class="fa-solid fa-trash"></i> Delete
                </button>

            </form>

        </div>

    </div>

</div>

<!-- DELETE MODAL ONLY ONE TIME -->
<div class="delete-modal" id="deleteModal">
    <div class="delete-modal-card">

        <div class="delete-icon">
            <i class="fa-solid fa-trash"></i>
        </div>

        <h2>Delete Booking?</h2>

        <p>Are you sure you want to delete this booking?</p>

        <div class="modal-actions">
            <button onclick="closeDeleteModal()" class="cancel-modal-btn">
                Cancel
            </button>

            <button onclick="confirmDelete()" class="confirm-modal-btn">
                Delete
            </button>
        </div>

    </div>
</div>

<script>
    let selectedDeleteForm = null;

    function openDeleteModal(button) {
        selectedDeleteForm = button.closest("form");
        document.getElementById("deleteModal").classList.add("show");
    }

    function closeDeleteModal() {
        document.getElementById("deleteModal").classList.remove("show");
        selectedDeleteForm = null;
    }

    function confirmDelete() {
        if (selectedDeleteForm) {
            selectedDeleteForm.submit();
        }
    }
</script>

</body>
</html>
